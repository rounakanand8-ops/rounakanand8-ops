<svg viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated rocket launching through a starfield, with a planet and orbiting moon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05061A"/>
      <stop offset="60%" stop-color="#0B0E23"/>
      <stop offset="100%" stop-color="#161A3A"/>
    </linearGradient>
    <radialGradient id="nebula" cx="30%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8A5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8A5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#C9B8FF"/>
      <stop offset="55%" stop-color="#8A5CF6"/>
      <stop offset="100%" stop-color="#432E8C"/>
    </radialGradient>
    <linearGradient id="rocketBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5F7FF"/>
      <stop offset="55%" stop-color="#C7CEEA"/>
      <stop offset="100%" stop-color="#7F88AD"/>
    </linearGradient>
    <linearGradient id="noseCone" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="40%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF5A36" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <style>
    @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes flicker { 0% { transform: scale(1, 1); } 100% { transform: scale(0.82, 1.22); } }
    @keyframes launch {
      0%   { transform: translate(90px, 206px)  rotate(-4deg);  opacity: 1; }
      45%  { transform: translate(230px, 40px)  rotate(-8deg);  opacity: 1; }
      68%  { transform: translate(305px, -110px) rotate(-10deg); opacity: 1; }
      82%  { transform: translate(340px, -210px) rotate(-10deg); opacity: 0; }
      100% { transform: translate(340px, -210px) rotate(-10deg); opacity: 0; }
    }
    .star { animation-name: twinkle; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .moon-orbit { transform-origin: 860px 58px; animation: orbit 9s linear infinite; }
    .flame { animation: flicker 0.32s ease-in-out infinite alternate; transform-origin: 0px -6px; }
    .rocket-launch { animation: launch 5.5s cubic-bezier(.45,.05,.55,.95) infinite; }
  </style>

  <rect width="1000" height="240" fill="url(#sky)"/>
  <rect width="1000" height="240" fill="url(#nebula)"/>

  <!-- starfield -->
  <g fill="#E8ECF7">
    <circle class="star" cx="636.6" cy="11.6" r="0.93" style="animation-duration:2.65s;animation-delay:2.58s"/>
    <circle class="star" cx="673.2" cy="134.7" r="0.7" style="animation-duration:3.04s;animation-delay:0.1s"/>
    <circle class="star" cx="224.3" cy="79.8" r="0.63" style="animation-duration:2.6s;animation-delay:2.27s"/>
    <circle class="star" cx="544.0" cy="39.3" r="1.31" style="animation-duration:3.82s;animation-delay:0.02s"/>
    <circle class="star" cx="799.7" cy="107.1" r="1.01" style="animation-duration:2.51s;animation-delay:3.35s"/>
    <circle class="star" cx="339.9" cy="21.2" r="0.72" style="animation-duration:3.89s;animation-delay:2.11s"/>
    <circle class="star" cx="801.0" cy="111.6" r="1.24" style="animation-duration:4.15s;animation-delay:1.32s"/>
    <circle class="star" cx="551.0" cy="125.8" r="1.34" style="animation-duration:3.92s;animation-delay:2.02s"/>
    <circle class="star" cx="700.5" cy="14.5" r="0.87" style="animation-duration:2.78s;animation-delay:0.28s"/>
    <circle class="star" cx="238.1" cy="22.3" r="0.93" style="animation-duration:3.47s;animation-delay:1.28s"/>
    <circle class="star" cx="372.8" cy="37.7" r="0.92" style="animation-duration:4.07s;animation-delay:2.27s"/>
    <circle class="star" cx="606.9" cy="32.3" r="1.47" style="animation-duration:2.53s;animation-delay:1.33s"/>
    <circle class="star" cx="979.7" cy="98.9" r="1.27" style="animation-duration:3.57s;animation-delay:2.95s"/>
    <circle class="star" cx="770.5" cy="40.5" r="0.64" style="animation-duration:2.83s;animation-delay:0.94s"/>
    <circle class="star" cx="216.8" cy="141.9" r="1.65" style="animation-duration:2.83s;animation-delay:2.29s"/>
    <circle class="star" cx="397.7" cy="137.9" r="1.15" style="animation-duration:2.73s;animation-delay:0.86s"/>
    <circle class="star" cx="560.1" cy="45.3" r="1.3" style="animation-duration:4.0s;animation-delay:1.4s"/>
    <circle class="star" cx="224.9" cy="149.7" r="1.21" style="animation-duration:2.38s;animation-delay:0.16s"/>
    <circle class="star" cx="117.5" cy="97.1" r="1.55" style="animation-duration:3.04s;animation-delay:0.22s"/>
    <circle class="star" cx="384.0" cy="149.4" r="1.23" style="animation-duration:4.14s;animation-delay:3.01s"/>
    <circle class="star" cx="21.3" cy="110.3" r="1.42" style="animation-duration:3.27s;animation-delay:0.93s"/>
    <circle class="star" cx="638.1" cy="23.8" r="1.12" style="animation-duration:3.11s;animation-delay:3.34s"/>
    <circle class="star" cx="868.3" cy="45.4" r="1.2" style="animation-duration:2.56s;animation-delay:3.19s"/>
    <circle class="star" cx="863.1" cy="50.4" r="1.37" style="animation-duration:3.42s;animation-delay:0.53s"/>
    <circle class="star" cx="757.3" cy="84.6" r="1.53" style="animation-duration:3.26s;animation-delay:0.0s"/>
    <circle class="star" cx="327.7" cy="10.8" r="1.71" style="animation-duration:3.96s;animation-delay:2.91s"/>
  </g>

  <!-- planet, tilted ring, orbiting moon -->
  <g transform="translate(860,58) rotate(-18)">
    <ellipse rx="54" ry="13" fill="none" stroke="#4FD8EB" stroke-opacity="0.4" stroke-width="1.6"/>
  </g>
  <circle cx="860" cy="58" r="30" fill="url(#planetBody)"/>
  <g class="moon-orbit">
    <circle cx="908" cy="58" r="4.2" fill="#E8ECF7"/>
  </g>

  <!-- ground / horizon curve -->
  <path d="M0,240 Q500,158 1000,240 Z" fill="#05061A" opacity="0.92"/>

  <!-- rocket -->
  <g class="rocket-launch">
    <g transform="rotate(0)">
      <ellipse class="flame" cx="0" cy="34" rx="9" ry="24" fill="url(#flame)" filter="url(#soften)"/>
      <polygon points="-9,8 -22,32 -8,26" fill="#4FD8EB"/>
      <polygon points="9,8 22,32 8,26" fill="#4FD8EB"/>
      <rect x="-9" y="-40" width="18" height="52" rx="9" fill="url(#rocketBody)"/>
      <path d="M -9,-40 Q 0,-60 9,-40 Z" fill="url(#noseCone)"/>
      <circle cx="0" cy="-16" r="5.5" fill="#0B0E23" stroke="#4FD8EB" stroke-width="2"/>
      <ellipse cx="-1.6" cy="-17.6" rx="1.4" ry="1" fill="#E8ECF7" opacity="0.85"/>
    </g>
  </g>
</svg>
