<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="45%" stop-color="#0b0f2b"/>
      <stop offset="100%" stop-color="#1b1147"/>
    </linearGradient>
    <radialGradient id="planet-body" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffd68a"/>
      <stop offset="55%" stop-color="#ff9d5c"/>
      <stop offset="100%" stop-color="#c4522a"/>
    </radialGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="45%" stop-color="#ffb648"/>
      <stop offset="100%" stop-color="#ff5b2e"/>
    </linearGradient>
    <linearGradient id="title-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ecbff"/>
      <stop offset="50%" stop-color="#c9a4ff"/>
      <stop offset="100%" stop-color="#8ecbff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#space-bg)"/>

  <!-- Twinkling starfield -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="35" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="120" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="60" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="150" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="45" r="1.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="200" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="90" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="150" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="220" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="70" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="180" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="55" r="1.7"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="130" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="200" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Ringed planet, top-right, gently bobbing -->
  <g transform="translate(1040,80)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="66" ry="16" fill="none" stroke="#ffd9a0" stroke-width="4" opacity="0.55" transform="rotate(-18)"/>
      <circle cx="0" cy="0" r="34" fill="url(#planet-body)"/>
      <ellipse cx="0" cy="0" rx="66" ry="16" fill="none" stroke="#ffe6bd" stroke-width="2.5" opacity="0.85" transform="rotate(-18)"/>
    </g>
  </g>

  <!-- Small moon orbiting the planet -->
  <g transform="translate(1040,80)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <circle cx="90" cy="0" r="6" fill="#d9d9e3"/>
    </g>
  </g>

  <!-- Rocket flying up-and-across on a diagonal path, with flickering flame -->
  <g>
    <animateMotion dur="6s" repeatCount="indefinite" path="M -60,260 C 200,200 420,140 760,40"/>
    <g transform="rotate(-28)">
      <polygon points="0,-24 12,10 0,4 -12,10" fill="#e9edf5"/>
      <polygon points="0,-24 12,10 0,4" fill="#c3cbe0"/>
      <circle cx="0" cy="-6" r="4.5" fill="#6fc2ff"/>
      <polygon points="-12,10 -22,24 -6,14" fill="#ff6b57"/>
      <polygon points="12,10 22,24 6,14" fill="#ff6b57"/>
      <polygon points="-6,12 0,32 6,12" fill="url(#flame)">
        <animate attributeName="points" values="-6,12 0,32 6,12; -5,12 0,26 5,12; -6,12 0,32 6,12" dur="0.18s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>

  <!-- Title -->
  <text x="60" y="255" font-family="Verdana, Geneva, sans-serif" font-size="40" font-weight="700" fill="url(#title-glow)">Rounak Anand</text>
  <text x="61" y="280" font-family="Verdana, Geneva, sans-serif" font-size="16" fill="#c9d3f0" opacity="0.85">Mission: Embedded Systems &#183; IoT &#183; AI/ML &#183; VLSI</text>
</svg>
