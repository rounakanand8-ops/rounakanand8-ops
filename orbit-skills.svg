<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e1130"/>
      <stop offset="100%" stop-color="#04050f"/>
    </radialGradient>
    <radialGradient id="sun" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff2c2"/>
      <stop offset="55%" stop-color="#ffb648"/>
      <stop offset="100%" stop-color="#ff7a2e"/>
    </radialGradient>
    <linearGradient id="p1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8ecbff"/><stop offset="100%" stop-color="#3f7fd6"/></linearGradient>
    <linearGradient id="p2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c9a4ff"/><stop offset="100%" stop-color="#7a49c9"/></linearGradient>
    <linearGradient id="p3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8effc2"/><stop offset="100%" stop-color="#2fa86a"/></linearGradient>
    <linearGradient id="p4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff9d8e"/><stop offset="100%" stop-color="#d64f4f"/></linearGradient>
    <linearGradient id="p5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffe08e"/><stop offset="100%" stop-color="#d69f2f"/></linearGradient>
    <linearGradient id="p6" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#9df0ff"/><stop offset="100%" stop-color="#2fa8c9"/></linearGradient>
  </defs>

  <rect width="900" height="900" fill="url(#bg2)"/>

  <!-- faint stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="40" cy="60" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="820" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="70" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="830" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orbit rings -->
  <g fill="none" stroke="#4a5590" stroke-width="1.5" opacity="0.5">
    <circle cx="450" cy="450" r="150"/>
    <circle cx="450" cy="450" r="230"/>
    <circle cx="450" cy="450" r="310"/>
    <circle cx="450" cy="450" r="390"/>
  </g>

  <!-- Sun / center: Rounak -->
  <circle cx="450" cy="450" r="70" fill="url(#sun)"/>
  <text x="450" y="445" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="19" font-weight="700" fill="#1b1147">ROUNAK</text>
  <text x="450" y="466" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#3a2a10">ECE Final Year</text>

  <!-- Orbit 1: Embedded Systems -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 450 450" to="360 450 450" dur="14s" repeatCount="indefinite"/>
    <g transform="translate(600,450)">
      <circle r="30" fill="url(#p1)"/>
      <text y="48" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#dce6ff">Embedded</text>
    </g>
  </g>

  <!-- Orbit 2: IoT -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="80 450 450" to="440 450 450" dur="20s" repeatCount="indefinite"/>
    <g transform="translate(680,450)">
      <circle r="28" fill="url(#p2)"/>
      <text y="46" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#dce6ff">IoT</text>
    </g>
  </g>

  <!-- Orbit 3: AI / LLMs -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="160 450 450" to="-200 450 450" dur="26s" repeatCount="indefinite"/>
    <g transform="translate(760,450)">
      <circle r="32" fill="url(#p3)"/>
      <text y="50" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#dce6ff">AI / LLMs</text>
    </g>
  </g>

  <!-- Orbit 4: VLSI / FPGA -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="240 450 450" to="600 450 450" dur="32s" repeatCount="indefinite"/>
    <g transform="translate(840,450)">
      <circle r="26" fill="url(#p4)"/>
      <text y="44" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#dce6ff">VLSI / FPGA</text>
    </g>
  </g>

  <!-- Orbit 0 (inner): Image Processing -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="300 450 450" to="-60 450 450" dur="10s" repeatCount="indefinite"/>
    <g transform="translate(520,450)">
      <circle r="22" fill="url(#p6)"/>
      <text y="38" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" fill="#dce6ff">Img Proc.</text>
    </g>
  </g>

  <!-- Outer: Signal Processing / ML research -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="30 450 450" to="390 450 450" dur="40s" repeatCount="indefinite"/>
    <g transform="translate(910,450)">
      <circle r="24" fill="url(#p5)"/>
      <text y="42" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" fill="#dce6ff">Fault Diagnosis</text>
    </g>
  </g>
</svg>
